    <!-- The worker that records a signed proposal. Opening the connection now saves the
         handshake at the moment somebody presses Sign, which is the one moment on this
         site where a slow connection is expensive. It is worth being honest about the
         limit: an idle connection is closed after roughly a minute, so this only helps a
         client who signs shortly after arriving. Someone who reads the whole document
         first gets nothing from it, which is why the retry in lib/proposals/sign.ts is the
         actual fix and this is a free extra. crossorigin because the request it is warming
         is a CORS one, and without it the browser opens a second connection anyway. -->
    <link rel="preconnect" href="https://proposal-sign.joji-dev.workers.dev" crossorigin>
    <!-- Azeret Mono is the Mono Index design's only family and is needed for first paint
         on / and /projects. The rest serve the older /freelance and /talk pages.
         Dancing Script is used in exactly one place, the typed-name signature on a proposal,
         where it is painted onto a canvas rather than set as text. It is loaded here rather
         than lazily with the proposal route on purpose: a canvas silently falls back to a
         default face if the font is not ready when it draws, which would put plain text on
         the pad and script in the recorded image, or the reverse. -->
    <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Dancing+Script:wght@600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Anti-flash: settle the theme before first paint.
         No saved choice means follow the operating system, which is what ThemeContext
         also does on mount. If these two disagree the page flashes the wrong theme. -->
    <script>
      (function () {
        var LIGHT = {
          '--bg-primary': '#FFFFFF', '--text-primary': '#2A2820',
          '--bg-secondary': '#EBE8E2', '--bg-tertiary': '#EBE8E2',
          '--accent': '#5F7161', '--accent-dim': 'rgba(95, 113, 97, 0.15)',
          '--accent-secondary': '#8D9A7C', '--accent-secondary-dim': '#8D9A7C33',
          '--text-muted': '#9C9890'
        };
        var DARK = {
          '--bg-primary': '#0C0F14', '--text-primary': '#F5F3EE',
          '--bg-secondary': '#293122', '--bg-tertiary': '#293122',
          '--accent': '#8D9A7C', '--accent-dim': 'rgba(141, 154, 124, 0.2)',
          '--accent-secondary': '#C3C9A5', '--accent-secondary-dim': '#C3C9A533',
          '--text-muted': 'rgba(245, 243, 238, 0.35)'
        };
        var mode = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            mode = saved;
          } else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
            mode = 'dark';
          }
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', mode);
        var tokens = mode === 'dark' ? DARK : LIGHT;
        for (var k in tokens) root.style.setProperty(k, tokens[k]);
      })();
    </script>
    <style>
      :root {
        --bg-primary: #FFFFFF;
        --bg-secondary: #EBE8E2;
        --bg-tertiary: #EBE8E2;
        --text-primary: #2A2820;
        --text-muted: #9C9890;
        --accent: #5F7161;
        --accent-dim: rgba(95, 113, 97, 0.15);
        --accent-secondary: #8D9A7C;
        --accent-secondary-dim: #8D9A7C33;

        --font-display: 'Bricolage Grotesque', sans-serif;
        --font-body: 'Instrument Sans', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /*
        `overflow-x: clip` rather than `hidden` on all three.

        They do the same clipping, but `hidden` makes the element a scroll container, and a
        scroll container ancestor silently kills `position: sticky` on everything inside it.
        That is why the proposal's action bar stopped sticking after about 830px of a
        12,300px document, taking "Accept and sign" off screen for 93% of the page. `clip`
        clips without creating the container, so sticky survives.

        `hidden` is declared first as the fallback: anything too old for `clip` ignores the
        second line and keeps today's behaviour rather than gaining a horizontal scrollbar.
      */
      html {
        scroll-behavior: smooth;
        overflow-x: hidden;
        overflow-x: clip;
      }

      body {
        font-family: var(--font-display);
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        overflow-x: clip;
        width: 100%;
        max-width: 100vw;
      }

      #root {
        overflow-x: hidden;
        overflow-x: clip;
        width: 100%;
        max-width: 100vw;
      }

      ::selection {
        background: var(--accent);
        color: var(--bg-primary);
      }

      /* Grain overlay */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.03;
        pointer-events: none;
        z-index: 50;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--accent);
      }

      /* Light mode grain */
      [data-theme="light"] body::before {
        opacity: 0.015;
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes glitch {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(2deg); }
      }

      .animate-in {
        animation: fadeInUp 0.8s ease-out forwards;
        opacity: 0;
      }

      .delay-1 { animation-delay: 0.1s; }
      .delay-2 { animation-delay: 0.2s; }
      .delay-3 { animation-delay: 0.3s; }
      .delay-4 { animation-delay: 0.4s; }
      .delay-5 { animation-delay: 0.5s; }
      .delay-6 { animation-delay: 0.6s; }
    </style>
  </head>

    <div id="root"></div>
